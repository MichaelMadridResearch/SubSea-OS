[project]
name = "subsea-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
